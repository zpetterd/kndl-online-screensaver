start on started lab126_gui
stop on stopping lab126_gui

pre-start script
    source /etc/upstart/functions

    /bin/sh /mnt/us/extensions/onlinescreensaver/bin/scheduler.sh &

    true
end script

post-stop script
    PID=`ps xa | grep "/bin/sh /mnt/us/extensions/onlinescreensaver/bin/scheduler.sh" | awk '{ print $1 }'`
    kill $PID || true
end script
