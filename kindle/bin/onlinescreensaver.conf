start on started lab126_gui
stop on stopping lab126_gui

env SRCDIR=/mnt/us/extensions/onlinescreensaver/bin
env RUNDIR=/tmp/onlinescreensaver

pre-start script
    source /etc/upstart/functions

    # Copy scripts to tmpfs so the scheduler never holds open file
    # handles on /mnt/us.  The fsp FUSE daemon cannot cleanly unmount
    # the FAT32 partition for USB export while files are open, which
    # corrupts the FAT cluster chain.
    mkdir -p "${RUNDIR}"
    cp "${SRCDIR}"/*.sh "${RUNDIR}/"

    /bin/sh "${RUNDIR}/scheduler.sh" &

    true
end script

post-stop script
    PID=$(ps xa | grep "[/]tmp/onlinescreensaver/scheduler.sh" | awk '{ print $1 }')
    # shellcheck disable=SC2086
    kill $PID || true
    rm -rf /tmp/onlinescreensaver
end script
